name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manifests:   # kit:manifests:start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Install Claude Code CLI (for plugin validate)
        run: npm install -g @anthropic-ai/claude-code
      - name: Manifests, versions, install policy, kit copies, rendered blocks
        run: python3 scripts/kit/check-manifests.py --validate
      - name: Secret scan (tree and history)
        run: python3 scripts/kit/secret-scan.py --tree --history
      - name: Local markdown links
        run: python3 scripts/kit/check-links.py
  # kit:manifests:end
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generated agents are current
        run: node scripts/build.mjs --check
      - name: Marketplace, manifests, agents and skills
        run: node scripts/validate.mjs
      - name: Shell helpers parse
        run: for f in plugins/*/scripts/*.sh scripts/*.sh fixtures/mobile-app/build.sh; do bash -n "$f"; done

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install the engine's locked dependencies outside the plugin
        run: node plugins/agentic-tests/engine/run-agentic-tests/scripts/agentic-tests.mjs doctor --setup
      - name: Engine contracts, CLI, runtimes and reports
        run: node --test tests/engine/*.test.mjs
